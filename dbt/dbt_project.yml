# Transformation project.
#
# Layered on purpose: a staging view over the landing table, then a mart table
# built from it. The staging model is materialised as a view because PostgreSQL
# validates column references at CREATE VIEW, so an upstream column rename fails
# there — in a specific, named model — and the mart is reported as skipped
# rather than silently rebuilt from stale data.
# See adr/0008-transform-through-a-staging-view-into-a-mart-table.md

name: adc_warehouse
version: 1.0.0
config-version: 2

profile: adc_warehouse

model-paths: ["models"]
macro-paths: ["macros"]

# fixtures/ is deliberately absent from every path dbt reads. It exists to
# stand in for the extract step while verifying this project by hand, and must
# never be reachable from a pipeline run.
# See adr/0007-split-the-landing-table-contract-from-its-population.md

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  adc_warehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: analytics
